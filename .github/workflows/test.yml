name: Tests
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 12
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: v1/${{ runner.os }}/node-12/${{ hashFiles('**/package-lock.json') }}
          restore-keys: v1/${{ runner.os }}/node-12/
      - name: Install dependencies
        run: npm install
      - name: Run tests
        # .npmrc sets ignore-scripts=true (supply-chain hardening, PER-9533).
        # On npm 6 that also suppresses `npm test` (the run-script itself), so
        # percy never executes, no Percy build is created, and the required
        # percy/* commit status is never reported. Re-enable scripts for just
        # this invocation so the test script runs; dependency installs above
        # stay hardened.
        run: npm test
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          npm_config_ignore_scripts: "false"
